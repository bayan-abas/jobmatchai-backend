# Activated via SPRING_PROFILES_ACTIVE=production on Elastic Beanstalk. This layers a handful of
# production-appropriate overrides on TOP of application.properties - it does not replace it, and
# every property this app already reads via ${ENV_VAR:default} (datasource, JWT secret, OpenAI
# key, mail, CORS origin, frontend URL, S3 bucket/region, etc.) still comes from real environment
# variables exactly as it does today. See DEPLOYMENT.md for the complete required-env-var list.
#
# Deliberately NOT re-declared here: spring.datasource.url and app.jwt.secret. Both already have
# a startup guard (ProductionConfigGuard, JwtService's constructor check) that detects the EXACT
# insecure dev-default value and refuses to start when app.environment=prod. Giving either
# property a different placeholder value in THIS file would replace that dev default with a new
# value the guard doesn't recognize - the app would then start "successfully" against a bogus
# datasource URL or sign real JWTs with a secret sitting in source control, which is worse than
# today's fail-fast behavior. Leaving them alone keeps that existing protection intact; a genuinely
# missing SPRING_DATASOURCE_URL/JWT_SECRET on EB still fails loudly, just via the existing guard
# rather than a new one.

# Ties this Spring profile to the app's own (pre-existing) custom dev/prod switch, so activating
# SPRING_PROFILES_ACTIVE=production is the one flag that also satisfies ProductionConfigGuard and
# JwtService's guard above - no second env var to remember. See application.properties' own
# comments on every place app.environment is read (verification codes, password-reset links,
# startup guards) for the full list of behavior this flips.
app.environment=prod

# Elastic Beanstalk's load balancer sits in front of every request, so the app must trust the
# X-Forwarded-For header it sets to see the real client IP - otherwise every request appears to
# come from the load balancer's own address, and IP-based rate limiting (login lockout, etc.)
# either blocks everyone behind the LB together or effectively does nothing. Defaults to false in
# application.properties specifically because that header is attacker-controlled unless something
# in front of the app is actually overwriting it - true is only safe once you're sure of that,
# which on EB you are.
app.proxy.trust-x-forwarded-for=true

# See service/storage/FileStorageService - "s3" stores CVs in the bucket configured by
# APP_S3_BUCKET_NAME/APP_S3_REGION instead of local disk, since an EB instance's local filesystem
# does not survive a redeploy/restart. Local dev (this profile inactive) keeps using disk under
# app.upload.dir exactly as before.
app.storage.type=s3

# ---------------------------------------------------------------------------------------------
# Required environment variables when this profile is active (set on the EB environment, ideally
# sourced from AWS Secrets Manager for the sensitive ones - see DEPLOYMENT.md):
#
#   SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD  (Supabase Postgres)
#   JWT_SECRET                                                                     (openssl rand -base64 48)
#   OPENAI_API_KEY
#   MAIL_HOST, MAIL_USERNAME, MAIL_PASSWORD                                        (if email is enabled)
#   APP_CORS_ALLOWED_ORIGIN                                                        (your Amplify/CloudFront frontend URL)
#   APP_FRONTEND_URL                                                               (same, used to build password-reset links)
#   APP_S3_BUCKET_NAME, APP_S3_REGION                                              (CV storage - see app.storage.type above)
#   PORT                                                                           (set automatically by EB)
#
# AWS credentials for S3 are intentionally NOT in this list: the AWS SDK's default credential
# provider chain resolves them on its own, and an EB instance IAM role (scoped to this one bucket)
# is the recommended way to provide them in production - no AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY
# env vars needed. Only fall back to static keys for local testing against a real bucket outside
# EB. See DEPLOYMENT.md.
# ---------------------------------------------------------------------------------------------
