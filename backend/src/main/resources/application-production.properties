# Activated via SPRING_PROFILES_ACTIVE=production on the deployment platform (e.g. Render). This
# layers a handful of production-appropriate overrides on TOP of application.properties - it does
# not replace it, and every property this app already reads via ${ENV_VAR:default} (datasource,
# JWT secret, OpenAI key, mail, CORS origin, frontend URL, Supabase Storage bucket, etc.) still
# comes from real environment variables exactly as it does today.
#
# Deliberately NOT re-declared here: spring.datasource.url and app.jwt.secret. Both already have
# a startup guard (ProductionConfigGuard, JwtService's constructor check) that detects the EXACT
# insecure dev-default value and refuses to start when app.environment=prod. Giving either
# property a different placeholder value in THIS file would replace that dev default with a new
# value the guard doesn't recognize - the app would then start "successfully" against a bogus
# datasource URL or sign real JWTs with a secret sitting in source control, which is worse than
# today's fail-fast behavior. Leaving them alone keeps that existing protection intact; a genuinely
# missing SPRING_DATASOURCE_URL/JWT_SECRET on Render still fails loudly, just via the existing
# guard rather than a new one.

# Ties this Spring profile to the app's own (pre-existing) custom dev/prod switch, so activating
# SPRING_PROFILES_ACTIVE=production is the one flag that also satisfies ProductionConfigGuard and
# JwtService's guard above - no second env var to remember. See application.properties' own
# comments on every place app.environment is read (verification codes, password-reset links,
# startup guards) for the full list of behavior this flips.
app.environment=prod

# Render (like most PaaS load balancers) sits in front of every request, so the app must trust
# the X-Forwarded-For header it sets to see the real client IP - otherwise every request appears
# to come from the platform's own proxy address, and IP-based rate limiting (login lockout, etc.)
# either blocks everyone behind it together or effectively does nothing. Defaults to false in
# application.properties specifically because that header is attacker-controlled unless something
# in front of the app is actually overwriting it - true is only safe once you're sure of that,
# which behind Render's proxy you are.
app.proxy.trust-x-forwarded-for=true

# See service/storage/FileStorageService - "supabase" stores CVs in Supabase Storage (bucket
# configured by SUPABASE_STORAGE_BUCKET) instead of local disk, since a Render instance's local
# filesystem is ephemeral and does not survive a redeploy/restart. Local dev (this profile
# inactive) keeps using disk under app.upload.dir exactly as before.
app.storage.type=supabase

# ---------------------------------------------------------------------------------------------
# Required environment variables when this profile is active (set them on the Render service's
# Environment tab - this file only ever reads them via ${ENV_VAR:default} in application.properties,
# never hardcodes a value):
#
#   SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD
#       Supabase Postgres - use the connection pooler (Project Settings > Database > Connection
#       pooling > Session mode, port 5432), not the direct db.<ref>.supabase.co host: a hosted
#       platform's connection count adds on top of everything else sharing the same Supabase
#       project, and the pooler is built for exactly that. Session mode (not transaction mode) is
#       required because this app uses normal JDBC/Hikari connections, not one-shot pooled
#       statements. The pooler username is formatted postgres.<project-ref>, not plain postgres.
#   JWT_SECRET                                                                     (openssl rand -base64 48)
#   OPENAI_API_KEY
#   MAIL_HOST, MAIL_USERNAME, MAIL_PASSWORD                                        (real email delivery - see EmailVerificationService/PasswordResetService)
#   APP_CORS_ALLOWED_ORIGIN                                                        (your Firebase Hosting frontend URL)
#   APP_FRONTEND_URL                                                               (same, used to build password-reset links)
#   SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, SUPABASE_STORAGE_BUCKET               (CV storage - see app.storage.type above)
#   PORT                                                                           (set automatically by Render)
#
# Deliberately NOT in this list: STRIPE_*, AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY, APP_S3_*.
# Payments use the demo/mock endpoints only (see PaymentController's /demo/* routes) - real Stripe
# keys are never required. AWS/S3 credentials are never required either - CV storage is Supabase
# Storage, authenticated with the single SUPABASE_SERVICE_ROLE_KEY above, not AWS-style keys.
# ---------------------------------------------------------------------------------------------
