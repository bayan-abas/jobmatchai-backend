spring.application.name=backend
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE:10}
spring.datasource.hikari.connection-timeout=${SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT:10000}

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}

spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}

# No entity in this app uses JPA relationships (@OneToMany/@ManyToOne/etc.), so
# Open Session In View provides no benefit here - it only holds a DB connection
# for the whole request instead of just the query, which is expensive against a
# remote database where every connection is scarce and every round trip is slow.
spring.jpa.open-in-view=false

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# Defaults to a location OUTSIDE the project directory (the user's home folder) so a
# fresh local run never accidentally writes uploaded CVs back into the git working tree
# the way the old "uploads/cvs/" (relative to CWD) default did. In production, set
# APP_UPLOAD_DIR to a persistent, non-ephemeral location - a mounted volume or object
# storage - since a container's local disk does not survive a redeploy/restart.
app.upload.dir=${APP_UPLOAD_DIR:${user.home}/jobmatchai-uploads/cvs/}

# Application-level cap for /api/cv/upload specifically (see CVController#uploadCV), enforced
# separately from - and well under - the global spring.servlet.multipart.max-file-size above, so
# an oversized CV gets this endpoint's normal {"success":false,"message":...} response instead of
# Spring's generic multipart error page. Default 10MB (10485760 bytes).
app.cv.upload.max-size-bytes=${APP_CV_UPLOAD_MAX_SIZE_BYTES:10485760}

app.jwt.secret=${JWT_SECRET:dev-only-insecure-secret-change-me-before-deploying-to-production-0123456789}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Shared secret for operator/cron-triggered internal endpoints (currently just
# POST /api/external-jobs/import - see ExternalJobController) that have no natural candidate/
# company user to authenticate as. Blank by default = always rejected, never "open to everyone".
app.internal-api-key=${INTERNAL_API_KEY:}

# Comma-separated list of allowed frontend origins (e.g. a production domain plus
# http://localhost:5173 for local dev against the same backend) - see SecurityConfig.
app.cors.allowed-origin=${APP_CORS_ALLOWED_ORIGIN:http://localhost:5173}
app.frontend-url=${APP_FRONTEND_URL:http://localhost:5173}
app.environment=${APP_ENVIRONMENT:dev}

# Rate limiting for the auth endpoints (login, send-verification-code, register/verify-code,
# forgot-password, reset-password) - see com.jobmatchai.backend.security.ratelimit,
# AuthController, and UserController. Except for login (see below), each bucket allows
# <capacity> attempts per <window-seconds>, refilling gradually rather than resetting all at
# once at the window boundary. Disabling is meant for tests/local debugging, not production.
ratelimit.auth.enabled=${RATE_LIMIT_AUTH_ENABLED:true}

# Login uses a fixed lockout (LoginLockoutService), not a token bucket: <capacity> failed
# attempts are allowed, then the IP/email is completely blocked for <window-seconds> starting
# from that failure, and automatically allowed again once that lockout expires. Successful
# logins don't count against this and clear any accumulated failures.
ratelimit.auth.login.capacity=${RATE_LIMIT_LOGIN_CAPACITY:5}
ratelimit.auth.login.window-seconds=${RATE_LIMIT_LOGIN_WINDOW_SECONDS:60}

ratelimit.auth.send-verification-code.capacity=${RATE_LIMIT_SEND_VERIFICATION_CODE_CAPACITY:3}
ratelimit.auth.send-verification-code.window-seconds=${RATE_LIMIT_SEND_VERIFICATION_CODE_WINDOW_SECONDS:600}

# Counts only failed (wrong/expired) verification-code attempts on /api/auth/register - see the
# InvalidVerificationCodeException catch block in AuthController#register.
ratelimit.auth.verify-code.capacity=${RATE_LIMIT_VERIFY_CODE_CAPACITY:5}
ratelimit.auth.verify-code.window-seconds=${RATE_LIMIT_VERIFY_CODE_WINDOW_SECONDS:600}

ratelimit.auth.forgot-password.capacity=${RATE_LIMIT_FORGOT_PASSWORD_CAPACITY:3}
ratelimit.auth.forgot-password.window-seconds=${RATE_LIMIT_FORGOT_PASSWORD_WINDOW_SECONDS:900}

ratelimit.auth.reset-password.capacity=${RATE_LIMIT_RESET_PASSWORD_CAPACITY:5}
ratelimit.auth.reset-password.window-seconds=${RATE_LIMIT_RESET_PASSWORD_WINDOW_SECONDS:900}

# X-Forwarded-For is attacker-controlled input unless something in front of this app (a reverse
# proxy / load balancer) is configured to overwrite it on every inbound request. Only flip this on
# for deployments that actually sit behind such a proxy - see ClientIpResolver - otherwise IP-based
# rate limiting above can be trivially bypassed by forging the header.
app.proxy.trust-x-forwarded-for=${APP_PROXY_TRUST_X_FORWARDED_FOR:false}

stripe.secret-key=${STRIPE_SECRET_KEY:}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}
stripe.premium-price-id=${STRIPE_PREMIUM_PRICE_ID:}

spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_PROPERTIES_MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE:true}

openai.api.key=${OPENAI_API_KEY:}
openai.api.url=${OPENAI_API_URL:https://api.openai.com/v1/responses}
openai.model=${OPENAI_MODEL:gpt-4.1}
# Used only for the high-volume bulk job-match scoring calls (see OpenAICVAnalysisService);
# a smaller/faster model here is what actually cuts wait time for match percentages to appear.
openai.match-model=${OPENAI_MATCH_MODEL:gpt-4.1-mini}
# Bounds every OpenAI call (chat + embeddings) - see OpenAIRestClientConfig. Without these, a
# hung request could block a match-scoring concurrency permit indefinitely.
openai.connect-timeout-ms=${OPENAI_CONNECT_TIMEOUT_MS:10000}
openai.read-timeout-ms=${OPENAI_READ_TIMEOUT_MS:45000}
# Backs the deterministic, keyword-free embedding pre-filter in JobMatchService/EmbeddingService.
# 512 (a shortened, still-normalized text-embedding-3-small vector) is plenty for a coarse
# "same field or not" gate - this isn't a fine-grained search-ranking use case.
openai.embedding-model=${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}
openai.embedding-dimensions=${OPENAI_EMBEDDING_DIMENSIONS:512}
# Shipped OFF/shadow-mode first and calibrated against real candidates (a doctor CV scored
# 0.10-0.31 against an all-tech/corporate job pool, all correctly unrelated; a software CV
# scored 0.30-0.46 across both related AND unrelated jobs in that same-ish domain, with the
# LOWEST genuinely-related verdict at 0.37) - 0.15 never came close to excluding a real match in
# that data, so it's now enabled. Shadow logging (see JobMatchService) stays on regardless of
# this flag, so any future close call is still visible - never fully trust and forget.
matching.embedding.prefilter.enabled=${MATCHING_EMBEDDING_PREFILTER_ENABLED:true}
matching.embedding.prefilter.threshold=${MATCHING_EMBEDDING_PREFILTER_THRESHOLD:0.15}

externaljobs.jooble.api-key=${JOOBLE_API_KEY:}
externaljobs.jsearch.api-key=${RAPIDAPI_KEY:}
externaljobs.jsearch.host=${RAPIDAPI_JSEARCH_HOST:jsearch.p.rapidapi.com}
externaljobs.import.country=${EXTERNAL_JOBS_COUNTRY:il}
# Every one of these categories is imported on every scheduled/startup cycle (see
# ExternalJobService#importAllCategories), not just one at a time - covers the general
# Israeli job market broadly (not just tech) plus explicit remote/work-from-home variants.
externaljobs.import.keywords=${EXTERNAL_JOBS_KEYWORDS:software developer,web developer,project manager,accountant,mechanical engineer,civil engineer,electrical engineer,graphic designer,electrician,physician,doctor,dentist,pharmacist,physical therapist,veterinarian,registered nurse,healthcare assistant,lawyer,attorney,teacher,chef,marketing manager,human resources,financial analyst,data analyst,IT support,social worker,real estate agent,plumber,HVAC technician,welder,security guard,bank teller,translator,retail sales associate,cashier,customer service representative,sales representative,administrative assistant,warehouse worker,logistics coordinator,driver,transportation,hospitality staff,hotel receptionist,cleaner,construction worker,manufacturing worker,remote customer service,remote software developer,work from home}
externaljobs.import.schedule-cron=${EXTERNAL_JOBS_IMPORT_CRON:0 0 */6 * * *}
# How long an imported external job stays visible before it's pruned as expired.
externaljobs.retention.days=${EXTERNAL_JOBS_RETENTION_DAYS:21}
